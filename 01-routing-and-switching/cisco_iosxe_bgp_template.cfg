!====================================================================
! Cisco IOS-XE Enterprise BGP & VRF-Lite Baseline Template
! Target Exams: CCNA (200-301) & CCNP ENCOR (350-401)
!====================================================================

vrf definition CORP_ANALYTICS
 rd 65000:100
 !
 address-family ipv4
 exit-address-family
!
interface GigabitEthernet0/0/1
 description WAN Connection to Primary ISP
 vrf forwarding CORP_ANALYTICS
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
router bgp 65000
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 !
 address-family ipv4 vrf CORP_ANALYTICS
  neighbor 203.0.113.1 remote-as 64512
  neighbor 203.0.113.1 activate
  neighbor 203.0.113.1 soft-reconfiguration inbound
  network 10.100.0.0 mask 255.255.0.0
 exit-address-family
!
